<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MotosX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
<div class="container-fluid">
    <div class="row vh-100">

        <!-- IZQUIERDA -->

        <div class="col-lg-6 hero p-0">
            <a href="index.html" class="btn btn-dark btn-home">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
            <div class="overlay">
                <div class="hero-content">
                    <h1>Bienvenido a MotosX</h1>
                    <p>
                        Inicia sesión y continúa comprando
                        los mejores repuestos compatibles
                        para tu motocicleta.
                    </p>
                </div>
            </div>
        </div>

        <!-- DERECHA -->

        <div class="col-lg-6 d-flex justify-content-center align-items-center">
            <div class="login-box">
                <h1 class="text-center fw-bold mb-2">
                    MotosX
                </h1>
                <h2 class="text-center mb-4 fw-bold">
                    Iniciar Sesión
                </h2>
                <form id="formLogin" class="was-validated" novalidate>
            <div class="mb-3 mt-3">
             <label for="correo" class="form-label">Correo:</label>
             <input type="email" class="form-control" id="correo" placeholder="Escriba su correo" name="uname" required>
             <div class="valid-feedback">Valid.</div>
             <div class="text-center invalid-feedback">Por Favor introduzca su Correo Electrónico</div>
           </div>
           <div class="mb-3">
             <label for="pwd" class="form-label">Contraseña:</label>
             <input type="password" class="form-control" id="pwd" placeholder="Introduzca su Contraseña" name="pswd" required>
             <div class="valid-feedback">Valid.</div>
             <div class="text-center invalid-feedback">Por Favor introduzca su Contraseña.</div>
            </div>
              <div>
                <button type="submit" class="btn btn-register w-100" id="btnLogin">
                    Iniciar sesion
                </button>
              </div>
            <div class="text-center mt-4">
                    ¿No tienes una cuenta?
                    <a href="registro.html">
                        Crea sesión aquí
                    </a>
                </div>
</form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("formLogin").addEventListener("submit", function (e) {
    e.preventDefault();

    const form = e.target;

    if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
    }

    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("pwd").value;
    const boton = document.getElementById("btnLogin");

    boton.disabled = true;
    boton.textContent = "Ingresando...";

    fetch("php/auth/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo: correo, password: password })
    })
    .then(res => res.json())
    .then(data => {
        boton.disabled = false;
        boton.textContent = "Iniciar sesion";

        if (data.ok) {
            Swal.fire({
                icon: "success",
                title: "¡Bienvenido!",
                text: data.mensaje,
                confirmButtonColor: "#212529"
            }).then(() => {
                window.location.href = "index.html";
            });
        } else {
            Swal.fire({
                icon: "error",
                title: "No se pudo iniciar sesión",
                text: data.mensaje,
                confirmButtonColor: "#212529"
            });
        }
    })
    .catch(() => {
        boton.disabled = false;
        boton.textContent = "Iniciar sesion";
        Swal.fire({
            icon: "error",
            title: "Error de conexión",
            text: "No se pudo contactar al servidor. Intenta de nuevo.",
            confirmButtonColor: "#212529"
        });
    });
});
</script>

</body>
</html>
