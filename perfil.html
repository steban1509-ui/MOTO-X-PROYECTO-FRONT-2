<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil - MotosX</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>

<!------------------------------------------ NAVBAR -------------------------------------------->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
     <div class="container">
          <a class="navbar-brand" href="index.html">
            <img src="img/logo/moto_x_logo.jpg" height="60">
          </a>
         <div>
          <a href="carrito.html" class="text-dark me-4">
           <i class="fa-solid fa-cart-shopping"></i>
          </a>
          <span id="auth-area">
           <a href="login.html" class="text-dark me-4">
            <i class="fa-solid fa-user"></i>
           </a>
           <a href="registro.html" class="text-dark me-4">
            <i class="fas fa-user-edit"></i>
           </a>
          </span>
         </div>
     </div>
</nav>

<div class="container py-5">

    <h2 class="fw-bold mb-1">Mi perfil</h2>
    <p class="text-muted" id="perfilInfo">Cargando...</p>

    <hr>

    <h4 class="mt-4 mb-3">Mis pedidos</h4>

    <div id="listaPedidos">
        <p class="text-muted">Cargando pedidos...</p>
    </div>

</div>

<!-- Modal para modificar un pedido -->
<div class="modal fade" id="modalEditarPedido" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modificar pedido</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalEditarPedidoBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-dark" onclick="guardarCambiosPedido()">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-light text-center py-4">
     © 2026 MotosX. Todos los derechos reservados.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/perfil.js"></script>

</body>
</html>
